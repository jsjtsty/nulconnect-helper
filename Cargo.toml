[package]
name = "nulconnect-tun"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "nulconnect-tun-helper"
path = "src/bin/nulconnect_tun_helper.rs"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }
tun2proxy = { version = "0.8.2", optional = true, default-features = false }
url = "2"
libc = "0.2"

[features]
default = ["tun2proxy"]
tun2proxy = ["dep:clap", "dep:tokio", "dep:tun2proxy"]
