[package]
name = "nulconnect-helper"
version = "0.1.15"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "nulconnect-helper"
path = "src/bin/nulconnect_helper.rs"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tun-rs = { version = "2", features = ["interruptible"] }
url = "2"
libc = "0.2"
reatrust = { path = "../libreatrust" }

[features]
default = []
verbose-logs = []
